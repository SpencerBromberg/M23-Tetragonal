# Verifies the deposit and replays the full certificate suite on every push,
# and on demand from the Actions tab.
name: Replay certificates
on:
  push:
  workflow_dispatch:
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r deposit/M23-Tetragonal/requirements.txt
      - name: Verify checksums and manifest
        run: cd deposit/M23-Tetragonal && sh VERIFY_CHECKSUMS.sh
      - name: Replay certificate suite
        run: cd deposit/M23-Tetragonal && sh RUN_ALL_CERTIFICATES.sh
